name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: typecheck (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck:shard ${{ matrix.shard }}/3

  typecheck-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck:workspace
      - run: pnpm typecheck:root
      - run: pnpm typecheck:compat:workspace

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (${{ matrix.shard }}/8)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --config script/vitest.workspace.ts --shard=${{ matrix.shard }}/8

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:server

  test-desktop-runner-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-
      - uses: ./.github/actions/setup
      - run: pnpm test:desktop
      - run: pnpm test:runner
      - run: pnpm test:app

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:guards

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Required-check name stays `validate` so branch protection does not change.
  validate:
    if: always()
    needs:
      - lint
      - typecheck
      - typecheck-workspace
      - test
      - test-server
      - test-desktop-runner-app
      - guards
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to succeed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.typecheck-workspace.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.test-server.result }}" = success
          test "${{ needs.test-desktop-runner-app.result }}" = success
          test "${{ needs.guards.result }}" = success
          test "${{ needs.build.result }}" = success

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/electron-builder.yml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-
      - uses: ./.github/actions/setup
        with:
          filter: '@antumbra/desktop...'
      - run: pnpm --filter @antumbra/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-macos-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
