packages:
  - apps/*
  - packages/*

catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.225
  "@biomejs/biome": 2.5.1
  "@effect/atom-react": 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-rc.108
  "@effect/vitest": 4.0.0-rc.108
  "@fontsource-variable/inter": 5.3.0
  "@modelcontextprotocol/sdk": 1.30.0
  "@prisma-next/adapter-sqlite": 0.15.0
  "@prisma-next/cli": 0.15.0
  "@prisma-next/contract": 0.15.0
  "@prisma-next/sql-contract": 0.15.0
  "@prisma-next/sqlite": 0.15.0
  "@radix-ui/react-dialog": 1.1.23
  "@radix-ui/react-scroll-area": 1.2.18
  "@radix-ui/react-select": 2.3.7
  "@radix-ui/react-separator": 1.1.15
  "@radix-ui/react-slot": 1.3.3
  "@radix-ui/react-tooltip": 1.2.16
  "@shivaedev/effect-prisma": 0.5.3
  "@shivaedev/effect-trpc": 0.3.2
  "@tailwindcss/vite": 4.3.3
  "@trpc/client": 11.18.0
  "@trpc/server": 11.18.0
  "@types/node": 24.10.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@typescript/native": npm:typescript@7.0.2
  "@vitejs/plugin-react": 6.0.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dependency-cruiser: 18.1.1
  effect: 4.0.0-rc.108
  electron: 43.3.0
  electron-builder: 26.15.7
  happy-dom: 20.11.2
  ignore: 7.0.6
  lucide-react: 1.31.0
  mermaid: 11.3.0
  react: 19.2.8
  react-dom: 19.2.8
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  rolldown: 1.2.2
  scheduler: 0.27.0
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  typescript: npm:@typescript/typescript6@6.0.2
  vite: 8.2.0
  vitest: 4.1.9

savePrefix: ""
catalogMode: strict

overrides:
  # Mermaid's newer compatible transitive releases lost the trust evidence
  # accepted by the no-downgrade policy. These versions satisfy Mermaid 11.3.
  "@mermaid-js/parser": 0.3.0
  cytoscape: 3.33.1
  langium: 3.0.0
  # `@prisma-next/cli-telemetry` asks for `^1.2.3`; 1.2.4 and 1.2.5 dropped the
  # provenance attestation earlier versions carried, which `trustPolicy:
  # no-downgrade` rejects. Drop the pin once an attested release lands.
  "@vercel/detect-agent": 1.2.3

packageExtensions:
  # Langium 3 imports vscode-jsonrpc internals without declaring it directly.
  # Keep those imports on the 8.x implementation supplied by its own server.
  "langium@3.0.0":
    dependencies:
      vscode-jsonrpc: 8.2.0

trustPolicyExclude:
  - "semver@5.7.2 || 6.3.1"

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@shivaedev/*"
  # The 4.0 release candidate is younger than the quarantine window. Pinned to
  # the exact versions in the catalog, never the package name, so a fresh
  # release cannot slip in unreviewed; the last entry is a transitive
  # dependency of @effect/platform-node. Remove all four once 2026-08-19
  # passes and the window covers them.
  - "effect@4.0.0-rc.108"
  - "@effect/vitest@4.0.0-rc.108"
  - "@effect/platform-node@4.0.0-rc.108"
  - "@effect/platform-node-shared@4.0.0-rc.108"
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
