name: Setup
description: Install pnpm, Node, and the frozen lockfile.

inputs:
  filter:
    description: Optional workspace filter for installation.
    default: ""
  save-cache:
    description: Whether this job owns the default-branch pnpm cache.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - id: store
      run: |
        echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        echo "arch=$(node -p process.arch)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache/restore@v4
      id: pnpm-cache
      with:
        path: ${{ steps.store.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ steps.store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          node-cache-${{ runner.os }}-${{ steps.store.outputs.arch }}-pnpm-
    - run: |
        if [ -n "$INSTALL_FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$INSTALL_FILTER"
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.filter }}
    - uses: actions/cache/save@v4
      if: inputs.save-cache == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
