appId: dev.shivae.antumbra
productName: Antumbra
electronVersion: 43.3.0
# sharp ships N-API prebuilds that are ABI-stable across Node and Electron; rebuilding would only require a native toolchain.
npmRebuild: false
directories:
  output: release
files:
  - out/**
  # Antumbra drives the installed Claude Code CLI; the SDK's unused platform binaries add about 270 MB.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
# Native .node addons require a real path outside ASAR; sharp and its @img prebuilds are the only native code Antumbra loads.
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
extraResources:
  - from: out/persistence
    to: persistence
  - from: out/skills
    to: skills
mac:
  # A workspace install contains only the current host's sharp prebuild, so packaging remains single-architecture.
  target:
    - dmg
  identity: null
