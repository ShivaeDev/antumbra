savePrefix: ""
catalogMode: strict

overrides:
  "@shivaedev/sql": 0.40.0
  "@shivaedev/test-sql": 0.21.2
  "@shivaedev/test-story": 0.39.2
  # Mermaid's newer compatible transitive releases lost the trust evidence
  # accepted by the no-downgrade policy. These versions satisfy Mermaid 11.3.
  "@mermaid-js/parser": 0.3.0
  cytoscape: 3.33.1
  langium: 3.0.0

packageExtensions:
  # Langium 3 imports vscode-jsonrpc internals without declaring it directly.
  # Keep those imports on the 8.x implementation supplied by its own server.
  "langium@3.0.0":
    dependencies:
      vscode-jsonrpc: 8.2.0

trustPolicyExclude:
  - "semver@5.7.2 || 6.3.1"

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@shivaedev/*"
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
